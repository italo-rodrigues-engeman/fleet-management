<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${title}">Redefinição de Senha</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;

            border-radius: 8px;
            overflow: hidden;

            padding: 20px;
        }
        .logo {
            text-align: center;
            padding: 15px 0 25px;
        }
        .logo img {
            width: 120px;
        }
        .card {
            background-color: #ffffff;
            border-radius: 8px;
            padding: 25px;
            margin-bottom: 15px;
        }
        .title {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin: 0 0 25px 0;
            padding-bottom: 15px;
            border-bottom: 1px solid #e5e5e5;
        }
        .content {
            color: #333;
        }
        .code-box {
            margin: 20px auto;
            padding: 10px 15px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            display: inline-block;
            font-size: 2em;
            font-weight: bold;
            letter-spacing: 2px;
            text-align: center;
            width: 150px;
        }
        .footer {
            text-align: center;
            font-size: 12px;
            color: #9e9e9e;
            padding-top: 10px;
        }
        p {
            margin: 10px 0;
        }
    </style>
</head>
